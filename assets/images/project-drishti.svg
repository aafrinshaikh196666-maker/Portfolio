<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 480" width="800" height="480" fill="none">
  <defs>
    <linearGradient id="dr-bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#040e1f"/>
      <stop offset="60%" stop-color="#0a1834"/>
      <stop offset="100%" stop-color="#161233"/>
    </linearGradient>
    <linearGradient id="dr-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#2dd4bf"/>
      <stop offset="50%" stop-color="#38bdf8"/>
      <stop offset="100%" stop-color="#818cf8"/>
    </linearGradient>
    <filter id="dr-glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <!-- Background Base -->
  <rect width="800" height="480" rx="16" fill="url(#dr-bg)"/>

  <!-- Computer Vision Viewport -->
  <g transform="translate(150, 45)" filter="url(#dr-glow)">
    <rect width="500" height="330" rx="16" fill="#08172e" stroke="url(#dr-grad)" stroke-width="2"/>
    
    <!-- Viewport Reticle Corners -->
    <!-- Top-Left -->
    <path d="M20 50 L20 20 L50 20" stroke="#2dd4bf" stroke-width="3" stroke-linecap="round"/>
    <!-- Top-Right -->
    <path d="M450 20 L480 20 L480 50" stroke="#2dd4bf" stroke-width="3" stroke-linecap="round"/>
    <!-- Bottom-Left -->
    <path d="M20 280 L20 310 L50 310" stroke="#2dd4bf" stroke-width="3" stroke-linecap="round"/>
    <!-- Bottom-Right -->
    <path d="M450 310 L480 310 L480 280" stroke="#2dd4bf" stroke-width="3" stroke-linecap="round"/>

    <!-- Live CV Stream Overlay Badge -->
    <rect x="25" y="30" width="130" height="24" rx="12" fill="#0f2649" stroke="#38bdf8" stroke-width="1"/>
    <circle cx="38" cy="42" r="4" fill="#ef4444"/>
    <text x="48" y="46" fill="#ffffff" font-family="monospace" font-size="10" font-weight="700">CV CAM 60FPS</text>

    <!-- Center Reticle / Crosshair -->
    <circle cx="250" cy="165" r="40" stroke="#38bdf8" stroke-width="1" stroke-dasharray="4 4" stroke-opacity="0.4"/>
    <line x1="250" y1="120" x2="250" y2="135" stroke="#38bdf8" stroke-width="2"/>
    <line x1="250" y1="195" x2="250" y2="210" stroke="#38bdf8" stroke-width="2"/>
    <line x1="205" y1="165" x2="220" y2="165" stroke="#38bdf8" stroke-width="2"/>
    <line x1="280" y1="165" x2="295" y2="165" stroke="#38bdf8" stroke-width="2"/>

    <!-- Bounding Box 1: Obstacle / Chair -->
    <g transform="translate(70, 110)">
      <rect width="130" height="150" rx="4" fill="#38bdf8" fill-opacity="0.08" stroke="#38bdf8" stroke-width="2" stroke-dasharray="2 2"/>
      <rect x="0" y="-18" width="105" height="18" fill="#0284c7" rx="3"/>
      <text x="6" y="-5" fill="#ffffff" font-family="monospace" font-size="9" font-weight="600">Chair (97.8%)</text>
    </g>

    <!-- Bounding Box 2: Book / Text Surface -->
    <g transform="translate(240, 95)">
      <rect width="180" height="140" rx="4" fill="#2dd4bf" fill-opacity="0.08" stroke="#2dd4bf" stroke-width="2"/>
      <rect x="0" y="-18" width="120" height="18" fill="#0d9488" rx="3"/>
      <text x="6" y="-5" fill="#ffffff" font-family="monospace" font-size="9" font-weight="600">Document (98.4%)</text>
      <text x="12" y="30" fill="#99f6e4" font-family="monospace" font-size="9">"Chapter 4: Algorithms"</text>
      <text x="12" y="48" fill="#5eead4" font-family="monospace" font-size="9">TTS: "Audio Synthesizing..."</text>
    </g>

    <!-- Bottom Audio Waveform / Text-to-Speech bar -->
    <g transform="translate(30, 265)">
      <rect width="440" height="45" rx="8" fill="#0c1f3d" stroke="#1e3a64" stroke-width="1"/>
      <circle cx="25" cy="22" r="12" fill="#2563eb"/>
      <!-- Speaker icon -->
      <path d="M21 18 L24 18 L28 15 L28 29 L24 26 L21 26 Z" fill="#ffffff"/>
      <path d="M30 19 C31 21 31 23 30 25" stroke="#ffffff" stroke-width="1.5" stroke-linecap="round"/>
      <text x="46" y="26" fill="#f1f5f9" font-family="sans-serif" font-size="10" font-weight="600">Audio Narration Output:</text>
      <!-- Sound waves -->
      <g stroke="#38bdf8" stroke-width="2" stroke-linecap="round" transform="translate(195, 22)">
        <line x1="0" y1="-8" x2="0" y2="8"/>
        <line x1="8" y1="-14" x2="8" y2="14"/>
        <line x1="16" y1="-5" x2="16" y2="5"/>
        <line x1="24" y1="-12" x2="24" y2="12"/>
        <line x1="32" y1="-18" x2="32" y2="18"/>
        <line x1="40" y1="-9" x2="40" y2="9"/>
        <line x1="48" y1="-15" x2="48" y2="15"/>
        <line x1="56" y1="-4" x2="56" y2="4"/>
        <line x1="64" y1="-11" x2="64" y2="11"/>
      </g>
      <text x="275" y="26" fill="#94a3b8" font-family="monospace" font-size="9">"Book detected 1.2m ahead"</text>
    </g>
  </g>

  <!-- Bottom Title Badge -->
  <g transform="translate(260, 395)">
    <rect width="280" height="48" rx="24" fill="#08172e" stroke="url(#dr-grad)" stroke-width="1.5"/>
    <circle cx="30" cy="24" r="8" fill="#2dd4bf" fill-opacity="0.2"/>
    <circle cx="30" cy="24" r="4" fill="#2dd4bf"/>
    <text x="50" y="29" fill="#ffffff" font-family="sans-serif" font-weight="700" font-size="14" letter-spacing="1">DRISHTI AI</text>
    <text x="175" y="29" fill="#5eead4" font-family="monospace" font-size="11">PYTHON &bull; OPENCV</text>
  </g>
</svg>
