<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 480" fill="none">
  <defs>
    <linearGradient id="ss-bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#061224"/>
      <stop offset="60%" stop-color="#0b1b38"/>
      <stop offset="100%" stop-color="#141130"/>
    </linearGradient>
    <linearGradient id="ss-shield-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="50%" stop-color="#2563eb"/>
      <stop offset="100%" stop-color="#7c3aed"/>
    </linearGradient>
    <linearGradient id="ss-glow" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.25"/>
      <stop offset="100%" stop-color="#38bdf8" stop-opacity="0"/>
    </linearGradient>
    <filter id="ss-filter" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <!-- Background Base -->
  <rect width="800" height="480" rx="16" fill="url(#ss-bg)"/>
  
  <!-- Subtle Grid Pattern -->
  <g opacity="0.12" stroke="#38bdf8" stroke-width="1">
    <line x1="80" y1="0" x2="80" y2="480"/>
    <line x1="160" y1="0" x2="160" y2="480"/>
    <line x1="240" y1="0" x2="240" y2="480"/>
    <line x1="320" y1="0" x2="320" y2="480"/>
    <line x1="400" y1="0" x2="400" y2="480"/>
    <line x1="480" y1="0" x2="480" y2="480"/>
    <line x1="560" y1="0" x2="560" y2="480"/>
    <line x1="640" y1="0" x2="640" y2="480"/>
    <line x1="720" y1="0" x2="720" y2="480"/>
    <line x1="0" y1="80" x2="800" y2="80"/>
    <line x1="0" y1="160" x2="800" y2="160"/>
    <line x1="0" y1="240" x2="800" y2="240"/>
    <line x1="0" y1="320" x2="800" y2="320"/>
    <line x1="0" y1="400" x2="800" y2="400"/>
  </g>

  <!-- Glow orb in center -->
  <circle cx="400" cy="230" r="140" fill="url(#ss-glow)"/>

  <!-- Radar circles -->
  <circle cx="400" cy="230" r="190" stroke="#2563eb" stroke-width="1" stroke-opacity="0.2" stroke-dasharray="6 6"/>
  <circle cx="400" cy="230" r="130" stroke="#38bdf8" stroke-width="1.5" stroke-opacity="0.3"/>
  <circle cx="400" cy="230" r="70" stroke="#8b5cf6" stroke-width="1" stroke-opacity="0.4"/>

  <!-- Central Shield Graphic -->
  <g filter="url(#ss-filter)">
    <path d="M400 130 C440 130 470 145 470 175 C470 250 420 295 400 315 C380 295 330 250 330 175 C330 145 360 130 400 130 Z" 
          fill="#0c1e3d" stroke="url(#ss-shield-grad)" stroke-width="4"/>
    <!-- Inner Check & Brain Circuit inside Shield -->
    <path d="M380 220 L395 235 L425 200" stroke="#38bdf8" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/>
    <circle cx="400" cy="170" r="6" fill="#8b5cf6"/>
    <circle cx="365" cy="190" r="4" fill="#38bdf8"/>
    <circle cx="435" cy="190" r="4" fill="#38bdf8"/>
    <line x1="400" y1="176" x2="400" y2="195" stroke="#38bdf8" stroke-width="2" stroke-opacity="0.6"/>
  </g>

  <!-- Left Card: URL Threat Inspector -->
  <g transform="translate(60, 110)">
    <rect width="220" height="130" rx="12" fill="#0d1f3b" fill-opacity="0.85" stroke="#38bdf8" stroke-opacity="0.3" stroke-width="1"/>
    <circle cx="20" cy="22" r="4" fill="#ef4444"/>
    <circle cx="34" cy="22" r="4" fill="#eab308"/>
    <circle cx="48" cy="22" r="4" fill="#22c55e"/>
    <text x="20" y="52" fill="#94a3b8" font-family="monospace" font-size="11">SCANNING URL...</text>
    <rect x="20" y="62" width="180" height="22" rx="4" fill="#142b50"/>
    <text x="28" y="77" fill="#38bdf8" font-family="monospace" font-size="10">https://verify-portal.ai</text>
    <rect x="20" y="95" width="80" height="18" rx="4" fill="#10b981" fill-opacity="0.2"/>
    <text x="28" y="108" fill="#34d399" font-family="sans-serif" font-weight="600" font-size="9">✓ 99.4% SAFE</text>
  </g>

  <!-- Right Card: Real-time ML Pipeline -->
  <g transform="translate(520, 240)">
    <rect width="220" height="140" rx="12" fill="#0d1f3b" fill-opacity="0.85" stroke="#8b5cf6" stroke-opacity="0.3" stroke-width="1"/>
    <text x="20" y="30" fill="#c4b5fd" font-family="sans-serif" font-size="12" font-weight="600">NLP Text Classifier</text>
    <text x="20" y="48" fill="#64748b" font-family="monospace" font-size="10">Model: Naive Bayes + TF-IDF</text>
    <!-- Metric bars -->
    <text x="20" y="74" fill="#94a3b8" font-family="monospace" font-size="9">Phishing Probability</text>
    <rect x="20" y="80" width="180" height="6" rx="3" fill="#1e293b"/>
    <rect x="20" y="80" width="30" height="6" rx="3" fill="#38bdf8"/>
    <text x="20" y="108" fill="#94a3b8" font-family="monospace" font-size="9">Anomaly Score</text>
    <rect x="20" y="114" width="180" height="6" rx="3" fill="#1e293b"/>
    <rect x="20" y="114" width="22" height="6" rx="3" fill="#8b5cf6"/>
  </g>

  <!-- Bottom Title Badge -->
  <g transform="translate(250, 390)">
    <rect width="300" height="48" rx="24" fill="#0c1830" stroke="url(#ss-shield-grad)" stroke-width="1.5"/>
    <circle cx="30" cy="24" r="8" fill="#22c55e" fill-opacity="0.2"/>
    <circle cx="30" cy="24" r="4" fill="#22c55e"/>
    <text x="50" y="29" fill="#ffffff" font-family="sans-serif" font-weight="700" font-size="14" letter-spacing="1">SCAMSHIELD AI</text>
    <text x="200" y="29" fill="#93c5fd" font-family="monospace" font-size="11">PYTHON &bull; ML</text>
  </g>
</svg>
