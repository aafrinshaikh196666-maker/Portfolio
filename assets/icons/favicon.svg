<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" fill="none">
  <defs>
    <linearGradient id="bg-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#050e1d"/>
      <stop offset="50%" stop-color="#0d1b35"/>
      <stop offset="100%" stop-color="#1e1035"/>
    </linearGradient>
    <linearGradient id="accent-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="50%" stop-color="#2563eb"/>
      <stop offset="100%" stop-color="#8b5cf6"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>
  <!-- Background Shield/Rounded Square -->
  <rect width="100" height="100" rx="24" fill="url(#bg-grad)"/>
  <rect x="1" y="1" width="98" height="98" rx="23" stroke="url(#accent-grad)" stroke-width="1.5" stroke-opacity="0.6"/>
  <!-- Decorative Ring -->
  <circle cx="50" cy="50" r="38" stroke="#38bdf8" stroke-width="1" stroke-dasharray="4 4" stroke-opacity="0.3"/>
  <!-- Monogram AS -->
  <g filter="url(#glow)">
    <!-- Letter A -->
    <path d="M34 68 L44 32 L54 68 M37 58 L51 58" stroke="url(#accent-grad)" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/>
    <!-- Letter S Interlinked -->
    <path d="M66 40 C66 34 54 34 54 44 C54 54 66 54 66 64 C66 70 54 70 50 66" stroke="#ffffff" stroke-width="4.5" stroke-linecap="round" stroke-linejoin="round"/>
  </g>
  <!-- Sparkle dot -->
  <circle cx="68" cy="30" r="2.5" fill="#38bdf8"/>
</svg>
